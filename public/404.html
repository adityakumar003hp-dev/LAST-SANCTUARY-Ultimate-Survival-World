<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>404 Page Not Found | LAST SANCTUARY: Ultimate Survival World</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1b1610 0%, #070912 58%, #04050a 100%);
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      max-width: 560px;
      width: 100%;
      padding: 36px 32px;
      background: #101526;
      border: 1px solid #253354;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #f59e0b;
      margin-bottom: 10px;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
      color: #f9fafb;
    }
    p {
      margin: 0 0 26px;
      color: #a5b4cf;
      font-size: 15px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    a {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    a.primary {
      background: #f59e0b;
      color: #09090b;
    }
    a.primary:hover {
      background: #fbbf24;
      transform: translateY(-1px);
    }
    a.secondary {
      background: #172038;
      color: #dbeafe;
      border: 1px solid #2b3b63;
    }
    a.secondary:hover {
      background: #1e2a47;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">Sector 404 · Signal Lost</div>
    <h1>Route Outside Sanctuary Perimeter</h1>
    <p>
      The page you requested does not exist or has been relocated. Return to the main command terminal or inspect the official website sitemap.
    </p>
    <div class="actions">
      <a class="primary" href="/">Return to Last Sanctuary</a>
      <a class="secondary" href="/sitemap.html">View HTML Sitemap</a>
    </div>
  </main>
</body>
</html>
